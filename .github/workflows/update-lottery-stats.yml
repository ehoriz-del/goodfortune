name: Update lottery statistics

on:
  schedule:
    - cron: "20 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas lxml requests
      - run: python scripts/update_lottery_stats.py
      - name: Commit verified changes
        run: |
          if git diff --quiet -- lottery-stats.json; then exit 0; fi
          git config user.name "goodfortune-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery-stats.json
          git commit -m "Update lottery frequency statistics"
          git push
