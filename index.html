<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Good Fortune</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    text-align:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    color:#dbeafe;
    font-size:1.2rem;
    margin-bottom:40px;
}

.card{
    background:white;
    color:#222;
    border-radius:16px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.card h2{
    margin-bottom:20px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:14px 28px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.numbers{
    min-height:70px;
    margin-bottom:20px;
}

.ball{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:50px;
    height:50px;
    margin:5px;
    border-radius:50%;
    color:white;
    font-weight:bold;
    font-size:18px;
}

.white{
    background:#64748b;
}

.red{
    background:#dc2626;
}

.gold{
    background:#f59e0b;
}

.blue{
    background:#2563eb;
}

footer{
    margin-top:20px;
    color:#cbd5e1;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h1>🍀 Good Fortune</h1>

<p class="subtitle">
Generate Lucky Numbers for Powerball, Mega Millions & Chinese Lotto
</p>

<div class="card">

<h2>🇺🇸 Powerball</h2>

<div id="powerball" class="numbers"></div>

<button onclick="generatePowerball()">
🍀 Try Your Luck
</button>

</div>


<div class="card">

<h2>🇺🇸 Mega Millions</h2>

<div id="mega" class="numbers"></div>

<button onclick="generateMega()">
🍀 Try Your Luck
</button>

</div>


<div class="card">

<h2>🇨🇳 Chinese Double Color Ball (双色球)</h2>

<div id="china" class="numbers"></div>

<button onclick="generateChina()">
🍀 Try Your Luck
</button>

</div>

<footer>

Good Fortune wishes you the best of luck! 🍀

</footer>

</div>


<script>

function randomUnique(count,min,max){

    let numbers=[];

    while(numbers.length<count){

        let n=Math.floor(Math.random()*(max-min+1))+min;

        if(!numbers.includes(n)){
            numbers.push(n);
        }

    }

    numbers.sort((a,b)=>a-b);

    return numbers;
}

function createBalls(numbers,color){

    return numbers.map(num =>
        `<span class="ball ${color}">${num}</span>`
    ).join("");

}


function generatePowerball(){

    let white=randomUnique(5,1,69);

    let power=Math.floor(Math.random()*26)+1;

    document.getElementById("powerball").innerHTML=

        createBalls(white,"white")+

        `<span class="ball red">${power}</span>`;

}



function generateMega(){

    let white=randomUnique(5,1,70);

    let mega=Math.floor(Math.random()*25)+1;

    document.getElementById("mega").innerHTML=

        createBalls(white,"white")+

        `<span class="ball gold">${mega}</span>`;

}



function generateChina(){

    let red=randomUnique(6,1,33);

    let blue=Math.floor(Math.random()*16)+1;

    document.getElementById("china").innerHTML=

        createBalls(red,"red")+

        `<span class="ball blue">${blue}</span>`;

}


generatePowerball();

generateMega();

generateChina();

</script>

</body>
</html>
